name: Docker Build & Push to GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Grant write access to packages at workflow level
permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install flask flask-caching requests python-dotenv gunicorn
      - name: Syntax check
        run: |
          python -m py_compile app.py fetcher.py
          echo "✅ Syntax OK"

  build-and-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: devops-dashboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test — health endpoint
        run: |
          docker run -d --name dashboard-test -p 5000:5000 \
            -e GITHUB_USERNAME=vishalkonduru \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e SECRET_KEY=ci-test-secret \
            -e FLASK_DEBUG=false \
            devops-dashboard:test
          echo "Waiting for app to start..."
          for i in $(seq 1 15); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || true)
            if [ "$HTTP" = "200" ]; then
              echo "✅ App is up after ${i}s"
              break
            fi
            echo "Attempt $i: got $HTTP, retrying..."
            sleep 3
          done
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          echo "Health endpoint returned: $HTTP"
          test "$HTTP" = "200" || (docker logs dashboard-test && exit 1)
          BODY=$(curl -sf http://localhost:5000/health)
          echo "Response: $BODY"
          echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', 'bad status'"
          echo "✅ Health check passed"
          docker stop dashboard-test

      - name: Test — stats endpoint
        run: |
          docker run -d --name stats-test -p 5001:5000 \
            -e GITHUB_USERNAME=vishalkonduru \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e SECRET_KEY=ci-test-secret \
            -e FLASK_DEBUG=false \
            devops-dashboard:test
          echo "Waiting for app to start..."
          for i in $(seq 1 15); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/health || true)
            if [ "$HTTP" = "200" ]; then
              echo "✅ App is up after ${i}s"
              break
            fi
            echo "Attempt $i: got $HTTP, retrying..."
            sleep 3
          done
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/api/stats)
          echo "/api/stats returned: $HTTP"
          test "$HTTP" = "200" || (docker logs stats-test && exit 1)
          echo "✅ Stats endpoint passed"
          docker stop stats-test

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t devops-dashboard:scan .
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-dashboard:scan
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
